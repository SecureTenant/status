# Publiceert onze eigen statuspagina naar gh-pages.
#
# Dit vervangt Upptime's ingebouwde "Static Site CI", die bewust is uitgeschakeld
# (gh workflow disable). Hun workflowbestanden dragen "do not edit" en worden
# wekelijks overschreven door update-template, dus dit staat er bewust naast in
# plaats van dat het hun bestand aanpast.
#
# Bewust geen externe actions behalve checkout: elke third-party action is een
# leverancier met schrijfrechten in je pipeline.

name: Statuspagina

on:
  push:
    branches: [master]
    paths:
      - "history/summary.json"
      - "site/**"
      - ".github/workflows/statuspagina.yml"
  schedule:
    # Elk uur, zodat een net gepubliceerd onderhoudsvenster binnen een uur zichtbaar is en niet
    # pas wanneer er toevallig een meting binnenkomt.
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: statuspagina
  cancel-in-progress: false

jobs:
  publish:
    name: Bouwen en publiceren
    runs-on: ubuntu-latest
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Pagina samenstellen
        run: |
          mkdir -p /tmp/site
          cp site/index.html /tmp/site/index.html
          cp history/summary.json /tmp/site/summary.json
          echo "status.secure-tenant.com" > /tmp/site/CNAME
          # Zonder dit haalt GitHub Pages de inhoud door Jekyll heen.
          touch /tmp/site/.nojekyll

          # Gepland onderhoud komt uit de API, maar de PAGINA mag daar niet van afhangen: die
          # draait bewust buiten Azure, en een statuspagina die omvalt met wat hij bewaakt is
          # nutteloos. Daarom hier ophalen en als bestand meesturen. Lukt het niet, dan valt hij
          # terug op een lege lijst en toont de pagina gewoon de rest.
          if curl -fsS --max-time 20 https://api.secure-tenant.com/api/maintenance/upcoming -o /tmp/maintenance.json; then
            python3 -c "import json,sys; json.load(open('/tmp/maintenance.json'))"               && cp /tmp/maintenance.json /tmp/site/maintenance.json               || echo '{"windows":[]}' > /tmp/site/maintenance.json
          else
            echo '{"windows":[]}' > /tmp/site/maintenance.json
          fi

      - name: Publiceren naar gh-pages
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pages
          cd /tmp/pages
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -r /tmp/site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Niets gewijzigd, niets te publiceren."
          else
            git commit -m "statuspagina bijgewerkt [skip ci]"
            git push origin gh-pages
          fi
