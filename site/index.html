<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureTenant Status</title>
<meta name="description" content="De actuele beschikbaarheid van SecureTenant.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180x180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Michroma&display=swap">
<style>
  /* Tokens overgenomen uit app/src/index.css zodat dit hetzelfde product voelt. */
  :root {
    --accent: 133 79 243;
    --ink: 20 27 52;
    --text-2: 91 100 128;
    --text-3: 154 161 180;
    --line: 236 238 243;
    --line-strong: 214 217 226;
    --surface: 255 255 255;
    --page: 244 245 251;
    --pass: 6 118 71;
    --pass-bg: 236 253 243;
    --pass-bd: 159 227 186;
    --warn: 181 71 8;
    --warn-bg: 255 250 235;
    --warn-bd: 245 205 138;
    --crit: 180 35 24;
    --crit-bg: 254 243 242;
    --crit-bd: 242 184 178;
    --shadow: 0 1px 2px rgb(20 27 52 / .05), 0 8px 24px -12px rgb(20 27 52 / .10);
  }

  :root[data-theme="dark"] {
    --ink: 233 234 238;
    --text-2: 166 169 180;
    --text-3: 136 140 156;
    --line: 42 44 51;
    --line-strong: 58 61 70;
    --surface: 26 27 32;
    --page: 18 19 23;
    --pass: 124 222 172;
    --pass-bg: 25 38 32;
    --pass-bd: 44 71 57;
    --warn: 246 190 133;
    --warn-bg: 43 35 26;
    --warn-bd: 78 60 40;
    --crit: 255 154 145;
    --crit-bg: 43 30 29;
    --crit-bd: 78 48 45;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px -12px rgb(0 0 0 / .5);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  body {
    margin: 0;
    background: rgb(var(--page));
    color: rgb(var(--ink));
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 780px; margin: 0 auto; padding: 28px 20px 72px; }

  .top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 40px;
  }

  /* Zelfde opbouw als de header van de marketingsite: beeldmerk als afbeelding, "SecureTenant"
     in Michroma ernaast. Niet in hoofdletters, want de site doet dat ook niet. */
  .brand {
    font-family: Michroma, system-ui, sans-serif;
    font-size: 15px; letter-spacing: -.01em;
    color: rgb(var(--ink)); text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .brand img { width: 26px; height: 26px; object-fit: contain; flex: none; }

  /* Taal en thema naast elkaar, rechtsboven. */
  .controls { display: flex; align-items: center; gap: 8px; flex: none; }

  .lang {
    display: inline-flex;
    border: 1px solid rgb(var(--line));
    background: rgb(var(--surface));
    border-radius: 10px;
    overflow: hidden;
  }
  .lang button {
    border: 0; background: transparent; color: rgb(var(--text-3));
    font: inherit; font-size: 11.5px; font-weight: 700; letter-spacing: .04em;
    padding: 7px 9px; cursor: pointer;
    transition: color .15s, background .15s;
  }
  .lang button:hover { color: rgb(var(--ink)); }
  .lang button[aria-pressed="true"] { color: rgb(var(--surface)); background: rgb(var(--ink)); }
  .lang button:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: -2px; }

  .toggle {
    width: 34px; height: 34px; display: grid; place-items: center;
    border-radius: 10px; border: 1px solid rgb(var(--line));
    background: rgb(var(--surface)); color: rgb(var(--text-2));
    cursor: pointer; padding: 0; transition: color .15s, border-color .15s;
  }
  .toggle:hover { color: rgb(var(--ink)); border-color: rgb(var(--line-strong)); }
  .toggle:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }
  .toggle svg { width: 16px; height: 16px; display: block; }
  /* Moet specifieker zijn dan de regel hierboven, anders wint display:block
     van de browserstandaard voor [hidden] en zie je beide iconen tegelijk. */
  .toggle svg[hidden] { display: none; }

  .summary {
    background: rgb(var(--surface)); border: 1px solid rgb(var(--line));
    border-radius: 1rem; box-shadow: var(--shadow);
    padding: 26px 26px 24px; margin-bottom: 28px;
  }
  .summary h1 {
    margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.015em;
    text-wrap: balance; display: flex; align-items: center; gap: 11px;
  }
  .summary p { margin: 9px 0 0 22px; color: rgb(var(--text-2)); font-size: 14px; }

  .beacon { width: 11px; height: 11px; border-radius: 50%; background: rgb(var(--pass)); flex: none; position: relative; }
  .beacon.warn { background: rgb(var(--warn)); }
  .beacon.crit { background: rgb(var(--crit)); }
  .beacon::after {
    content: ""; position: absolute; inset: -5px; border-radius: 50%;
    border: 2px solid rgb(var(--pass) / .3); animation: pulse 2.6s ease-out infinite;
  }
  .beacon.warn::after { border-color: rgb(var(--warn) / .3); }
  .beacon.crit::after { border-color: rgb(var(--crit) / .3); }
  @keyframes pulse {
    0% { transform: scale(.7); opacity: 1; }
    70%, 100% { transform: scale(1.25); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .beacon::after { animation: none; opacity: .5; transform: none; }
  }

  /* Gepland onderhoud. Bewust in de waarschuwingskleur en niet in de storingskleur: aangekondigd
     onderhoud is geen storing, en het telt ook niet mee in de SLA. Rood zou dat tegenspreken. */
  .maint {
    border: 1px solid rgb(var(--warn-bd));
    background: rgb(var(--warn-bg));
    border-radius: 1rem;
    padding: 18px 20px;
    margin-bottom: 28px;
  }
  .maint + .maint { margin-top: -14px; }
  .maint h2 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 700;
    color: rgb(var(--warn));
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .maint h2 svg { width: 15px; height: 15px; flex: none; }
  .maint .when {
    font-size: 13px;
    font-weight: 600;
    color: rgb(var(--warn));
    font-variant-numeric: tabular-nums;
    margin: 0 0 8px;
  }
  .maint p.body {
    margin: 0;
    font-size: 13.5px;
    color: rgb(var(--text-2));
    white-space: pre-wrap;
  }
  .maint .note {
    margin: 10px 0 0;
    font-size: 11.5px;
    color: rgb(var(--text-3));
  }

  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: rgb(var(--text-3)); margin: 0 0 12px 2px;
  }

  .panel {
    background: rgb(var(--surface)); border: 1px solid rgb(var(--line));
    border-radius: 1rem; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 28px;
  }

  .row { padding: 20px 24px; }
  .row + .row { border-top: 1px solid rgb(var(--line)); }

  .row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 3px; }
  .row-name { font-size: 15px; font-weight: 600; flex: 1 1 auto; min-width: 8rem; }
  .row-desc { font-size: 13px; color: rgb(var(--text-3)); margin: 0 0 14px; }

  .pill {
    flex: none; font-size: 12px; font-weight: 600; padding: 3px 10px;
    border-radius: 999px; border: 1px solid; white-space: nowrap;
  }
  .pill.ok   { color: rgb(var(--pass)); background: rgb(var(--pass-bg)); border-color: rgb(var(--pass-bd)); }
  .pill.warn { color: rgb(var(--warn)); background: rgb(var(--warn-bg)); border-color: rgb(var(--warn-bd)); }
  .pill.crit { color: rgb(var(--crit)); background: rgb(var(--crit-bg)); border-color: rgb(var(--crit-bd)); }

  /* Elke staaf is een dag. De vorm draagt informatie, geen versiering. */
  .strip { display: flex; gap: 2px; height: 30px; align-items: stretch; }
  .strip i {
    flex: 1 1 0; min-width: 0; border-radius: 2px;
    background: rgb(var(--pass) / .55); transition: background .15s;
  }
  .strip i.warn { background: rgb(var(--warn) / .8); }
  .strip i.crit { background: rgb(var(--crit) / .85); }
  .strip i.none { background: rgb(var(--line-strong) / .5); }
  .strip i:hover { background: rgb(var(--pass)); }
  .strip i.warn:hover { background: rgb(var(--warn)); }
  .strip i.crit:hover { background: rgb(var(--crit)); }

  .scale {
    display: flex; justify-content: space-between; font-size: 11.5px;
    color: rgb(var(--text-3)); margin-top: 7px; font-variant-numeric: tabular-nums;
  }
  .scale b { font-weight: 600; color: rgb(var(--text-2)); }

  .empty { padding: 30px 24px; text-align: center; color: rgb(var(--text-3)); font-size: 14px; }

  footer {
    margin-top: 36px; padding-top: 20px; border-top: 1px solid rgb(var(--line));
    display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between;
    font-size: 12.5px; color: rgb(var(--text-3));
  }
  footer a { color: rgb(var(--text-2)); text-decoration: none; }
  footer a:hover { color: rgb(var(--accent)); }
  footer time { font-variant-numeric: tabular-nums; }

  @media (max-width: 560px) {
    .summary { padding: 22px 18px; }
    .summary h1 { font-size: 19px; }
    .row { padding: 18px; }
    .strip { height: 26px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="top">
    <a class="brand" href="https://secure-tenant.com">
      <img src="assets/logo.png" alt="">SecureTenant
    </a>
    <div class="controls">
      <div class="lang" id="langSwitch" role="group" aria-label="Taal">
        <button type="button" data-lang="nl" aria-pressed="true">NL</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    <button class="toggle" id="themeBtn" type="button" aria-label="Wissel naar donkere weergave">
      <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
      </svg>
    </button>
    </div>
  </div>

  <section class="summary">
    <h1><span class="beacon" id="beacon"></span><span id="headline"></span></h1>
    <p id="sub"></p>
  </section>

  <p class="section-label" data-t="maintenanceLabel"></p>
  <div id="maintenance"></div>

  <p class="section-label" data-t="componentsLabel"></p>
  <div class="panel" id="components">
    <p class="empty" data-t="loading"></p>
  </div>

  <p class="section-label" data-t="incidentsLabel"></p>
  <div class="panel">
    <p class="empty" data-t="noIncidents"></p>
  </div>

  <footer>
    <span><span data-t="updatedLabel"></span> <time id="updated">-</time></span>
    <span><a href="https://secure-tenant.com">secure-tenant.com</a></span>
  </footer>

</div>

<script>
(function () {
  'use strict';

  // ── Teksten ─────────────────────────────────────────────────────────────
  // Nederlands eerst, want dat is de taal van het product. Alles wat een bezoeker leest staat
  // hier, zodat er nergens anders in dit bestand nog een losse zin achterblijft.
  var STR = {
    nl: {
      docTitle: 'SecureTenant Status',
      themeToDark: 'Wissel naar donkere weergave',
      themeToLight: 'Wissel naar lichte weergave',
      maintenanceLabel: 'Gepland onderhoud',
      componentsLabel: 'Onderdelen',
      incidentsLabel: 'Recente incidenten',
      updatedLabel: 'Bijgewerkt',
      loading: 'Bezig met laden.',
      noIncidents: 'Geen incidenten in de afgelopen negentig dagen.',
      noMaintenance: 'Geen gepland onderhoud. We laten het hier weten zodra er iets gepland staat.',
      allGood: 'Alle systemen werken',
      degradedAt: 'Verstoring bij ',
      downAt: 'Storing bij ',
      and: ' en ',
      checkEvery: 'We controleren elke vijf minuten.',
      workingOnIt: 'We werken eraan. Deze pagina wordt elke vijf minuten bijgewerkt.',
      unknown: 'Status onbekend',
      unknownSub: 'We konden de meetgegevens niet ophalen. Dit zegt niets over of de dienst zelf werkt.',
      noData: 'Geen meetgegevens beschikbaar.',
      ok: 'Werkt', warn: 'Verstoord', crit: 'Storing',
      daysAgo: '90 dagen geleden', today: 'vandaag', available: ' beschikbaar',
      availableOver90: ' beschikbaar over negentig dagen',
      noOutage: 'geen storing', minutesDown: ' minuten niet bereikbaar',
      maintNow: 'Onderhoud bezig', maintPlanned: 'Gepland onderhoud',
      maintNote: 'Aangekondigd onderhoud telt niet mee als downtime.',
      until: ' tot ', at: ' om ',
      workers: 'achtergrondprocessen voor de scans'
    },
    en: {
      docTitle: 'SecureTenant Status',
      themeToDark: 'Switch to dark mode',
      themeToLight: 'Switch to light mode',
      maintenanceLabel: 'Planned maintenance',
      componentsLabel: 'Components',
      incidentsLabel: 'Recent incidents',
      updatedLabel: 'Updated',
      loading: 'Loading.',
      noIncidents: 'No incidents in the past ninety days.',
      noMaintenance: 'No planned maintenance. We will post it here as soon as something is scheduled.',
      allGood: 'All systems operational',
      degradedAt: 'Degraded: ',
      downAt: 'Outage: ',
      and: ' and ',
      checkEvery: 'We check every five minutes.',
      workingOnIt: 'We are working on it. This page updates every five minutes.',
      unknown: 'Status unknown',
      unknownSub: 'We could not load the measurements. This says nothing about whether the service itself is working.',
      noData: 'No measurements available.',
      ok: 'Operational', warn: 'Degraded', crit: 'Outage',
      daysAgo: '90 days ago', today: 'today', available: ' uptime',
      availableOver90: ' uptime over ninety days',
      noOutage: 'no outage', minutesDown: ' minutes unreachable',
      maintNow: 'Maintenance in progress', maintPlanned: 'Planned maintenance',
      maintNote: 'Announced maintenance does not count as downtime.',
      until: ' to ', at: ' at ',
      workers: 'background processes for the scans'
    }
  };

  var lang = 'nl';
  try {
    var savedLang = localStorage.getItem('st-status-lang');
    if (savedLang === 'en' || savedLang === 'nl') lang = savedLang;
  } catch (e) { /* privemodus */ }

  function t(key) { return STR[lang][key]; }
  function locale() { return lang === 'en' ? 'en-GB' : 'nl-NL'; }

  // ── Thema. Licht is de standaard, de keuze van de bezoeker wint en blijft bewaard. ──
  var root = document.documentElement;
  var btn = document.getElementById('themeBtn');
  var moon = document.getElementById('icoMoon');
  var sun = document.getElementById('icoSun');

  // `hidden` is een eigenschap van HTMLElement, niet van SVGElement: el.hidden = true op een
  // <svg> zet alleen een losse JS-eigenschap en raakt het attribuut niet aan.
  function setHidden(el, hide) {
    if (hide) el.setAttribute('hidden', '');
    else el.removeAttribute('hidden');
  }

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    var dark = theme === 'dark';
    setHidden(moon, dark);
    setHidden(sun, !dark);
    btn.setAttribute('aria-label', dark ? t('themeToLight') : t('themeToDark'));
  }

  var storedTheme = null;
  try { storedTheme = localStorage.getItem('st-status-theme'); } catch (e) { /* privemodus */ }
  applyTheme(storedTheme === 'dark' ? 'dark' : 'light');

  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('st-status-theme', next); } catch (e) { /* privemodus */ }
  });

  // Wat we vasthouden, zodat een taalwissel niet opnieuw hoeft op te halen.
  var cache = { summary: null, lastModified: null, maintenance: null, failed: false };

  // ── Onderdelen ──────────────────────────────────────────────────────────
  var DAYS = 90;
  var DESC = {
    website: 'secure-tenant.com',
    portaal: 'app.secure-tenant.com',
    api: 'api.secure-tenant.com'
  };

  function stateOf(item) {
    if (item.status === 'up') return 'ok';
    if (item.status === 'degraded') return 'warn';
    return 'crit';
  }

  function isoDay(daysAgo) {
    var d = new Date();
    d.setUTCHours(0, 0, 0, 0);
    d.setUTCDate(d.getUTCDate() - daysAgo);
    return d.toISOString().slice(0, 10);
  }

  function shortDay(iso) {
    var p = iso.split('-');
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]))
      .toLocaleDateString(locale(), { day: 'numeric', month: 'short', timeZone: 'UTC' });
  }

  function renderComponents() {
    var host = document.getElementById('components');
    host.textContent = '';

    if (cache.failed || !cache.summary) {
      var e = document.createElement('p');
      e.className = 'empty';
      e.textContent = cache.failed ? t('noData') : t('loading');
      host.appendChild(e);
      return;
    }

    var worst = 'ok';
    var broken = [];

    cache.summary.forEach(function (item) {
      var state = stateOf(item);
      if (state === 'crit') { worst = 'crit'; broken.push(item.name); }
      else if (state === 'warn' && worst !== 'crit') { worst = 'warn'; broken.push(item.name); }

      var row = document.createElement('div');
      row.className = 'row';

      var head = document.createElement('div');
      head.className = 'row-head';

      var name = document.createElement('span');
      name.className = 'row-name';
      name.textContent = item.name;

      var pill = document.createElement('span');
      pill.className = 'pill ' + state;
      pill.textContent = t(state);

      head.appendChild(name);
      head.appendChild(pill);

      var desc = document.createElement('p');
      desc.className = 'row-desc';
      desc.textContent = item.slug === 'workers' ? t('workers') : (DESC[item.slug] || item.url || '');

      var down = item.dailyMinutesDown || {};
      var strip = document.createElement('div');
      strip.className = 'strip';
      strip.setAttribute('role', 'img');
      strip.setAttribute('aria-label', item.name + ': ' + (item.uptime || '') + t('availableOver90'));

      for (var i = DAYS - 1; i >= 0; i--) {
        var iso = isoDay(i);
        var mins = down[iso] || 0;
        var bar = document.createElement('i');
        if (mins > 60) { bar.className = 'crit'; }
        else if (mins > 0) { bar.className = 'warn'; }
        bar.title = mins > 0
          ? shortDay(iso) + ' — ' + mins + t('minutesDown')
          : shortDay(iso) + ' — ' + t('noOutage');
        strip.appendChild(bar);
      }

      var scale = document.createElement('div');
      scale.className = 'scale';
      var l = document.createElement('span');
      l.textContent = t('daysAgo');
      var m = document.createElement('span');
      var b = document.createElement('b');
      b.textContent = item.uptime || '-';
      m.appendChild(b);
      m.appendChild(document.createTextNode(t('available')));
      var r = document.createElement('span');
      r.textContent = t('today');
      scale.appendChild(l); scale.appendChild(m); scale.appendChild(r);

      row.appendChild(head);
      row.appendChild(desc);
      row.appendChild(strip);
      row.appendChild(scale);
      host.appendChild(row);
    });

    document.getElementById('beacon').className = 'beacon' + (worst === 'ok' ? '' : ' ' + worst);
    document.getElementById('headline').textContent =
      worst === 'ok' ? t('allGood')
      : worst === 'warn' ? t('degradedAt') + broken.join(t('and'))
      : t('downAt') + broken.join(t('and'));
    document.getElementById('sub').textContent = worst === 'ok' ? t('checkEvery') : t('workingOnIt');

    if (cache.lastModified) {
      document.getElementById('updated').textContent =
        cache.lastModified.toLocaleDateString(locale(), { day: 'numeric', month: 'long' }) +
        t('at') + cache.lastModified.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
    }
  }

  function renderFailure() {
    document.getElementById('beacon').className = 'beacon warn';
    document.getElementById('headline').textContent = t('unknown');
    document.getElementById('sub').textContent = t('unknownSub');
    renderComponents();
  }

  // ── Gepland onderhoud ───────────────────────────────────────────────────
  // Komt uit een bestand dat de workflow erbij zet, niet rechtstreeks uit de API: deze pagina mag
  // niet afhangen van de omgeving die hij bewaakt.
  function when(a, b) {
    var opts = { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' };
    var sameDay = a.toDateString() === b.toDateString();
    return sameDay
      ? a.toLocaleDateString(locale(), opts) + t('until') + b.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' })
      : a.toLocaleDateString(locale(), opts) + t('until') + b.toLocaleDateString(locale(), opts);
  }

  function renderMaintenance() {
    var host = document.getElementById('maintenance');
    host.textContent = '';

    var now = new Date();
    var upcoming = (cache.maintenance || []).filter(function (w) {
      return new Date(w.endsAt) >= now;
    });

    // Een lege lijst is zelf ook informatie. Zonder dit blok stond er niets, en dan kan een
    // bezoeker niet zien of er geen onderhoud gepland staat of dat het gewoon niet geladen is.
    if (!upcoming.length) {
      var panel = document.createElement('div');
      panel.className = 'panel';
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = t('noMaintenance');
      panel.appendChild(p);
      host.appendChild(panel);
      return;
    }

    upcoming.forEach(function (w) {
      var start = new Date(w.startsAt);
      var end = new Date(w.endsAt);

      var box = document.createElement('section');
      box.className = 'maint';

      var h = document.createElement('h2');
      h.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">'
        + '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>';
      h.appendChild(document.createTextNode(start <= now ? t('maintNow') : t('maintPlanned')));
      box.appendChild(h);

      var whenEl = document.createElement('p');
      whenEl.className = 'when';
      whenEl.textContent = when(start, end);
      box.appendChild(whenEl);

      var title = document.createElement('p');
      title.className = 'body';
      title.style.fontWeight = '600';
      title.textContent = w.title;
      box.appendChild(title);

      if (w.description) {
        var body = document.createElement('p');
        body.className = 'body';
        body.textContent = w.description;
        box.appendChild(body);
      }

      var note = document.createElement('p');
      note.className = 'note';
      note.textContent = t('maintNote');
      box.appendChild(note);

      host.appendChild(box);
    });
  }

  // ── Taal toepassen ──────────────────────────────────────────────────────
  function applyLang() {
    root.setAttribute('lang', lang);
    document.title = t('docTitle');

    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
      el.textContent = t(el.getAttribute('data-t'));
    });

    Array.prototype.forEach.call(document.querySelectorAll('#langSwitch button'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
    });

    btn.setAttribute('aria-label',
      root.getAttribute('data-theme') === 'dark' ? t('themeToLight') : t('themeToDark'));

    if (cache.failed) renderFailure(); else renderComponents();
    renderMaintenance();
  }

  document.getElementById('langSwitch').addEventListener('click', function (e) {
    var target = e.target.closest('button[data-lang]');
    if (!target) return;
    lang = target.getAttribute('data-lang');
    try { localStorage.setItem('st-status-lang', lang); } catch (err) { /* privemodus */ }
    applyLang();
  });

  // ── Ophalen ─────────────────────────────────────────────────────────────
  applyLang();

  fetch('maintenance.json', { cache: 'no-cache' })
    .then(function (r) { return r.ok ? r.json() : { windows: [] }; })
    .then(function (d) { cache.maintenance = d.windows || []; renderMaintenance(); })
    .catch(function () { cache.maintenance = []; renderMaintenance(); });

  fetch('summary.json', { cache: 'no-cache' })
    .then(function (res) {
      if (!res.ok) throw new Error(res.status);
      var lm = res.headers.get('last-modified');
      return res.json().then(function (data) {
        cache.summary = data;
        cache.lastModified = lm ? new Date(lm) : new Date();
        cache.failed = false;
        renderComponents();
      });
    })
    .catch(function () { cache.failed = true; renderFailure(); });
})();
</script>
</body>
</html>
